services:
  app:
    build: .
    container_name: node_app
    ports:
      - "5000:5000"
    develop:
      watch:
        # 1. Sync source files instantly without rebuilding the container
        - path: ./src
          action: sync
          target: /app/src

        # 2. Rebuild the container automatically if dependencies change
        - path: ./package.json
          action: rebuild
    environment:
      DATABASE_URL: postgresql://postgres:PostgreSQL@postgres:5432/ai_code_review
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: PostgreSQL
      POSTGRES_DB: ai_code_review
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: